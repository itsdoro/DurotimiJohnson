<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team website | MIMO FMCW Radar | Durotimi Johnson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2229; --muted:#5B6270; --rule:#D9DCE1; --soft:#F5F6F8;
  --paper:#FFFFFF; --cardinal:#A6192E; --gold:#E8B53A; --goldwash:#FDF6E3;
  --head:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:1.0625rem/1.65 var(--body)}
a{color:var(--cardinal);text-underline-offset:.15em}
a:focus-visible,button:focus-visible{outline:2px solid var(--cardinal);outline-offset:3px}
img{max-width:100%}

/* nav */
.nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--rule);backdrop-filter:blur(6px)}
.nav-inner{max-width:68rem;margin:0 auto;padding:.7rem 1.5rem;display:flex;gap:1.5rem;align-items:center}
.nav-name{font:600 1.05rem var(--head);color:var(--ink);text-decoration:none;white-space:nowrap}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:1.1rem;overflow-x:auto;scrollbar-width:none}
.nav li a{font:500 .92rem var(--head);color:var(--muted);text-decoration:none;white-space:nowrap}
.nav li a:hover{color:var(--cardinal)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--rule);background:var(--soft)}
.hero-inner{max-width:68rem;margin:0 auto;padding:4.5rem 1.5rem 4rem;display:grid;grid-template-columns:13rem 1fr;gap:3rem;align-items:center;position:relative}
.smith{position:absolute;right:-9rem;top:50%;width:34rem;height:34rem;transform:translateY(-50%);opacity:.5;pointer-events:none}
.photo.headshot{object-fit:cover;padding:0;border:0;display:block}
.photo{width:13rem;aspect-ratio:4/5;background:#E4E6EA;border:1px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font:500 .9rem var(--head);text-align:center;padding:1rem}
.hero h1{font:600 clamp(2.4rem,5vw,3.6rem)/1.05 var(--head);margin:0 0 .4rem;letter-spacing:-.01em}
.hero .sub{font-size:1.2rem;color:var(--muted);margin:0 0 1.5rem}
.contact{display:grid;grid-template-columns:max-content 1fr;gap:.25rem 1rem;margin:0 0 1.5rem;font-size:.98rem}
.contact dt{font:500 .92rem var(--head);color:var(--muted)}
.contact dd{margin:0}

/* sections */
main{max-width:68rem;margin:0 auto;padding:0 1.5rem}
section{padding:3.5rem 0;border-bottom:1px solid var(--rule)}
section:last-of-type{border-bottom:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:1.5rem}
h2{font:600 1.9rem/1.2 var(--head);margin:0;padding-left:.8rem;border-left:4px solid var(--cardinal)}
h3{font:600 1.35rem/1.3 var(--head);margin:0 0 .25rem}
h4{font:600 1.05rem var(--head);margin:1.5rem 0 .4rem}
.to-top{font:500 .85rem var(--head);color:var(--muted);text-decoration:none;white-space:nowrap}
.to-top:hover{color:var(--cardinal)}
.prose{max-width:44rem}
.meta{color:var(--muted);font-size:.95rem;margin:0 0 1rem}

/* project entries: label column + content column */
.entry{padding:2rem 0;border-top:1px solid var(--rule)}
.entry:first-of-type{border-top:0;padding-top:0}
.fields{display:grid;grid-template-columns:11rem 1fr;gap:1rem 2rem;margin:1.25rem 0 0}
.fields dt{font:600 .95rem var(--head);color:var(--cardinal);padding-top:.15rem}
.fields dd{margin:0;max-width:44rem}
.feature{background:var(--soft);border:1px solid var(--rule);padding:2rem}

/* placeholders */
.ph{background:var(--goldwash);border:1.5px dashed var(--gold);padding:.9rem 1.1rem;color:#6B5A2E;font-style:italic}
.ph p{margin:.3rem 0}
.ph ul,.ph ol{margin:.4rem 0;padding-left:1.25rem}
.ph.essay{min-height:14rem;padding:1.5rem 1.75rem}
.ph strong{font-style:normal;color:#4E4120}
span.ph{display:inline;padding:.05rem .35rem}

.doc-links{display:flex;flex-wrap:wrap;gap:.6rem;margin:0;padding:0;list-style:none}
.doc-links a{display:inline-block;border:1px solid var(--rule);padding:.35rem .8rem;font:500 .92rem var(--head);text-decoration:none;background:var(--paper)}
.doc-links a:hover{border-color:var(--cardinal)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}
footer{border-top:1px solid var(--rule);background:var(--soft);font-size:.9rem;color:var(--muted)}
footer .inner{max-width:68rem;margin:0 auto;padding:1.75rem 1.5rem;display:flex;flex-wrap:wrap;gap:.5rem 2rem}

@media (max-width:760px){
  .nav-name{display:none}
  .hero-inner{grid-template-columns:1fr;gap:2rem;padding:3rem 1.5rem}
  .photo{width:10rem}
  .smith{opacity:.25}
  .fields{grid-template-columns:1fr;gap:.2rem}
  .fields dd{margin-bottom:1rem}
  .two-col{grid-template-columns:1fr}
  .feature{padding:1.25rem}
}
@media print{.nav,.to-top,.smith{display:none}section{break-inside:avoid-page}}
.fields dd ul{margin:0;padding-left:1.1rem}
.fields dd li{margin-bottom:.2rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0;list-style:none}
.tags li{border:1px solid var(--rule);background:var(--soft);padding:.1rem .6rem;font:500 .88rem var(--head)}
.plain{list-style:none;padding:0;margin:0}
.plain li{padding:.45rem 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:1rem}
.plain li:first-child{border-top:0}
.plain .when{color:var(--muted);font-size:.92rem;white-space:nowrap}
@media (max-width:760px){.plain li{flex-direction:column;gap:0}}

.doc-body{min-height:50vh}
</style>
</head>

</body>
</html>
